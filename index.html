<script>
const fields=["fullName", "title", "date", "time", "location", "unit", "description", "results", "investigator", "participants", "background", "findings", "more", "factors", "errors1", "errors2", "lessons", "recommendations", "commander"];
const logo=document.querySelector('.head img').src;
function clean(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function docHtml(data){const stamp=new Date().toLocaleDateString('he-IL');const val=k=>clean(data[k]||'—').replace(/\n/g,'<br>');
const field=(label,key)=>`<section><b>${label}:</b><div>${val(key)}</div></section>`;
return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>תחקיר - ${clean(data.title||'גדוד 424')}</title><style>@page{size:A4;margin:17mm}body{font-family:Arial,sans-serif;direction:rtl;color:#151515;margin:0;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between}.top img{width:135px;max-height:90px;object-fit:contain}.left{text-align:left;font-size:12px}.class{text-align:center;margin:7px}.title{text-align:center;font-size:20px;margin:10px 0}.outline{border:2px solid #111;padding:10px 16px}h3{font-size:15px;margin:20px 0 6px}section{margin:7px 0;break-inside:avoid}section div{margin:3px 18px 8px;white-space:normal;line-height:1.55}.motto{text-align:center;margin-top:45px;font-size:14px;font-weight:bold}@media print{button{display:none!important}}</style></head><body><div class="class">בלמ״ס</div><div class="top"><img src="${logo}"><div class="left"><b>גדוד 424</b><br>תאריך: ${stamp}<br>תחקיר: ${clean(data.fullName)}</div></div><h2 class="title">תחקיר – ${clean(data.title||'אירוע')}</h2><div class="outline"><h3>1. כללי</h3>${field('מועד האירוע', 'date')}${field('שעת האירוע','time')}${field('מקום','location')}${field('יחידה','unit')}${field('תיאור האירוע','description')}${field('תוצאות האירוע','results')}${field('גורם מתחקר','investigator')}${field('משתתפים בתחקיר','participants')}</div><h3>2. ממצאים</h3>${field('ממצאי רקע','background')}${field('ממצאים – רצף כרונולוגי','findings')}${field('ממצאים נוספים','more')}<h3>3. מסקנות</h3>${field('גורמים לאירוע','factors')}${field('תקלות','errors1')}${field('שגיאות','errors2')}<h3>4. לקחים</h3>${field('לקחים','lessons')}<h3>5. המלצות</h3>${field('המלצות','recommendations')}<h3>6. סיכום מפקד</h3>${field('סיכום מפקד','commander')}<p class="motto">״ראשונים לסגולה״</p></body></html>`;}
function saveWord(doc,name){const blob=new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name+'.doc';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));if(!data.WORD_PDF){alert('יש לבחור PDF או WORD');return}const doc=docHtml(data);const name='תחקיר_גדוד_424';if(data.WORD_PDF==='WORD'){saveWord(doc,name);return}const w=window.open('','_blank');if(!w){alert('יש לאפשר חלונות קופצים ב-Safari או לפתוח את האתר בדפדפן');return}w.document.open();w.document.write(doc.replace('</body>','<div style="margin:25px auto;text-align:center"><button onclick="window.print()" style="font-size:20px;padding:12px 24px">הדפסה / שמירה כ-PDF</button></div></body>'));w.document.close()});
</script></body></html>
